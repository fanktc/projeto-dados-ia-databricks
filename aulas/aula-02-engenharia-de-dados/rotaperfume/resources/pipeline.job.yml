# O pipeline da Rota do Perfume — o job que DUAS noites constroem.
#
# Ele começa com UMA tarefa e termina com dezoito. Abra o DAG no workspace
# depois de cada deploy: o desenho crescendo é a melhor tela das duas aulas.
#
#   NOITE 2 · engenharia de dados
#   prompt 1  raw_conferencia
#   prompt 2  + bronze_ingestao
#   prompt 3  + silver ×4 (em paralelo)
#   prompt 4  + gold_dimensoes → gold_fato_vendas → gold_marts → testes
#   prompt 6  + metricas_negocio e auditoria_metadado
#
#   NOITE 3 · ciência de dados
#   prompt 1  + ml_features
#   prompt 2  + ml_treino
#   prompt 3  + ml_score
#   prompt 4  + ml_testes
#   prompt 5  + ml_carteira_do_dia
#   prompt 6  + ml_promocao (entre treino e score)
#
# ML não ganha um bundle separado nem um repositório novo: é mais uma camada
# do mesmo pipeline, com os mesmos testes que interrompem o job.
#
# A ordem não é sugestão: cada camada lê a anterior. Se a conferência do raw
# falhar, a bronze não roda — e é isso que impede o dashboard de mostrar meio
# dado com cara de dado inteiro.

resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline
      description: Pipeline medallion da Rota do Perfume — raw, bronze, silver, gold, testes e o modelo de propensão.

      # Todo dia às 6h. Em dev o mode: development pausa sozinho.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        # ── 1. raw: os dez arquivos chegaram? ─────────────────────────
        - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        # ── 2. bronze: os CSVs viram Delta, sujeira preservada ────────
        - task_key: bronze_ingestao
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        # ── 3. silver: a limpeza ──────────────────────────────────────
        # As quatro rodam EM PARALELO: nenhuma depende da outra, todas dependem
        # da bronze. É o formato que o DAG desenha melhor na tela.
        #
        # O SQL usa o caminho completo lakehouse_rotaperfume.silver.x em vez de
        # variável: `sql_task` não substitui identificador por parâmetro, e SQL
        # legível vale mais numa aula do que IDENTIFIER(:catalog || '.silver.x').
        - task_key: silver_clientes
          depends_on: [{ task_key: bronze_ingestao }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/01-clientes.sql

        - task_key: silver_pedidos
          depends_on: [{ task_key: bronze_ingestao }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/02-pedidos.sql

        - task_key: silver_itens_e_produtos
          depends_on: [{ task_key: bronze_ingestao }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/03-itens-e-produtos.sql

        - task_key: silver_crm_e_financeiro
          depends_on: [{ task_key: bronze_ingestao }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/silver/04-crm-e-financeiro.sql

        # ── 4. gold: modelar para consumo ─────────────────────────────
        # Aqui a ordem volta a ser série: o fato lê as dimensões, os marts leem
        # o fato. Nada disso pode acontecer fora de ordem.
        - task_key: gold_dimensoes
          depends_on:
            - { task_key: silver_clientes }
            - { task_key: silver_pedidos }
            - { task_key: silver_itens_e_produtos }
            - { task_key: silver_crm_e_financeiro }
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/05-dimensoes.sql

        - task_key: gold_fato_vendas
          depends_on: [{ task_key: gold_dimensoes }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/06-fato-vendas.sql

        - task_key: gold_marts
          depends_on: [{ task_key: gold_fato_vendas }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/07-marts.sql

        # ── 5. os testes, por último e obrigatórios ───────────────────
        # Se qualquer um falhar, o job falha. Melhor o dashboard ficar com o
        # dado de ontem do que com o dado errado de hoje.
        - task_key: testes_de_qualidade
          depends_on: [{ task_key: gold_marts }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/08-testes.sql

        # ── 6. o que faz o agente de IA funcionar ─────────────────────
        # As views com nome de negócio e a auditoria de metadado. A auditoria
        # QUEBRA o job se alguma tabela ou coluna da gold estiver sem COMMENT:
        # metadado faltando é bug, não pendência de documentação.
        - task_key: metricas_de_negocio
          depends_on: [{ task_key: gold_marts }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/09-metricas-negocio.sql

        - task_key: auditoria_de_metadado
          depends_on: [{ task_key: metricas_de_negocio }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/gold/10-auditoria-metadado.sql

        # ── 7. ML: o pipeline para de contar o passado ────────────────
        # A noite 3. Cinco tarefas que transformam a gold em decisão:
        #
        #   ml_features → ml_treino → ml_promocao → ml_score → ml_testes
        #
        # Elas dependem de gold_marts porque leem fato_vendas e as dimensões —
        # e ficam DEPOIS dos testes de qualidade de propósito: não faz sentido
        # treinar modelo em cima de dado que não passou na conferência.
        #
        # Camada em Python onde há biblioteca (features, treino, score) e em
        # SQL onde há verificação (os testes). O mesmo critério da noite 2.
        - task_key: ml_features
          depends_on: [{ task_key: testes_de_qualidade }]
          notebook_task:
            notebook_path: ../src/ml/11-features.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: ml_treino
          depends_on: [{ task_key: ml_features }]
          notebook_task:
            notebook_path: ../src/ml/12-treino.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        # Treinar e promover são tarefas separadas de propósito: é isso que
        # impede um retreino ruim de virar produção sozinho de madrugada.
        - task_key: ml_promocao
          depends_on: [{ task_key: ml_treino }]
          notebook_task:
            notebook_path: ../src/ml/16-promocao.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: ml_score
          depends_on: [{ task_key: ml_promocao }]
          notebook_task:
            notebook_path: ../src/ml/13-score.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        # Os testes do MODELO. Quebram o job igual aos de ontem — porque um
        # modelo ruim não dá erro: ele entrega a lista errada com confiança.
        - task_key: ml_testes
          depends_on: [{ task_key: ml_score }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ml/14-testes-de-modelo.sql

        - task_key: ml_carteira_do_dia
          depends_on: [{ task_key: ml_testes }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ml/15-carteira-do-dia.sql
