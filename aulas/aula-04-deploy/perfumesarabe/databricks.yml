# This is a Declarative Automation Bundle definition for perfumesarabe.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: perfumesarabe
  uuid: bf64ee34-dea3-41d5-872e-0a34c7e469aa

include:
  - resources/*.yml

# O SQL das noites 2 e 3 mora nas pastas das aulas, não aqui. sync.paths sobe
# essas pastas junto com o bundle para que as tarefas SQL possam apontar para
# elas — assim o material da aula e o que roda em produção são o mesmo arquivo.
sync:
  paths:
    - .
    - ../../aula-02-engenharia-de-dados
    - ../../aula-03-ciencia-de-dados-e-agentes

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: SQL Warehouse que executa as tarefas SQL do pipeline

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-84cd5511-fa25.cloud.databricks.com
    variables:
      catalog: lakehouse_rotaperfume
      schema: bronze
      warehouse_id: 666be37e3fededf2
  prod:
    mode: production
    workspace:
      host: https://dbc-84cd5511-fa25.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/lvgalvaofilho@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/lvgalvaofilho@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse_rotaperfume
      schema: bronze
      warehouse_id: 666be37e3fededf2
    permissions:
      - user_name: lvgalvaofilho@gmail.com
        level: CAN_MANAGE
